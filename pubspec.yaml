name: fikra_app
description: A new Flutter project.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  url_launcher: ^6.3.0
  
  flutter:
    sdk: flutter

  dio: ^5.9.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  image_picker: ^0.8.7+5

  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/

  fonts:
    - family: Cetrl
      fonts:
        - asset: assets/fonts/cetrl_regular.ttf
        - asset: assets/fonts/cetrl_bold.ttf
          weight: 700
