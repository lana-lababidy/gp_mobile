name: fikra_app
description: A new Flutter project.

publish_to: 'none' # Remove this line if you want to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # المكتبات
  dio: ^5.9.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  image_picker: ^0.8.7+5

  # دعم اللغة العربية والـ RTL
  flutter_localizations:
    sdk: flutter

  # تنسيق التواريخ والأرقام
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png    # ✅ شعار التطبيق
    - assets/images/            # مجلد الصور

  fonts:
    - family: Cetrl
      fonts:
        - asset: assets/fonts/Cetrl-Regular.ttf
        - asset: assets/fonts/Cetrl-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
